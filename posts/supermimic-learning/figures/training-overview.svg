<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">训练闭环：目标、交互数据与参数更新</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#38654f" stroke-width="1.4"/></marker><marker id="grad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a95731" stroke-width="1.4"/></marker></defs><rect width="960" height="470" fill="#fffefb"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#233830"><text x="28" y="32" font-size="23" fill="#233830" text-anchor="start" font-weight="600">两类数据，一轮闭环</text><text x="28" y="58" font-size="15" fill="#65756d" text-anchor="start" font-weight="400">绿色实线表示数据流；橙色虚线表示用于改进参数的信号。</text><rect x="28" y="93" width="185" height="75" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="120.5" y="130.5" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">参考运动</text><text x="120.5" y="157.5" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">希望身体怎样动</text><rect x="280" y="93" width="175" height="75" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="367.5" y="130.5" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">Actor</text><text x="367.5" y="157.5" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">选择控制指令</text><rect x="520" y="93" width="175" height="75" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="607.5" y="130.5" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">物理仿真器</text><text x="607.5" y="157.5" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">执行后得到结果</text><rect x="755" y="93" width="175" height="75" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="842.5" y="130.5" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">数据池</text><text x="842.5" y="157.5" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">保存实际交互</text><path d="M 213 130 L 280 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 455 130 L 520 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 695 130 L 755 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><rect x="755" y="270" width="175" height="80" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="842.5" y="310.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">世界模型拟合</text><text x="842.5" y="337.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">沿已记录动作学预测</text><path d="M 842 168 L 842 270" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><rect x="410" y="270" width="260" height="80" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="540.0" y="310.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">Actor + 固定世界模型</text><text x="540.0" y="337.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">从池中起点想象 32 步</text><path d="M 755 310 L 670 310" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="705" y="291" font-size="14" fill="#65756d" text-anchor="middle" font-weight="400">模型</text><path d="M 790 168 L 790 217 L 540 217 L 540 270" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="632" y="208" font-size="14" fill="#65756d" text-anchor="middle" font-weight="400">抽状态与仿真条件</text><rect x="28" y="270" width="285" height="80" rx="12" fill="#f4e9d9" stroke="#d8ded5"/><text x="170.5" y="310.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">奖励、回报与 Critic</text><text x="170.5" y="337.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">比较参考目标，并估计后续收益</text><path d="M 410 310 L 313 310" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 120 168 L 120 270" fill="none" stroke="#38654f" stroke-widt