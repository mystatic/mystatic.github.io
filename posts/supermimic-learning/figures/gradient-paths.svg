<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title"><title id="title">PPO 与 SuperMimic 的策略更新路径</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#38654f" stroke-width="1.4"/></marker><marker id="grad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a95731" stroke-width="1.4"/></marker></defs><rect width="960" height="475" fill="#fffefb"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#233830"><text x="28" y="32" font-size="23" fill="#233830" text-anchor="start" font-weight="600">都用梯度，区别是梯度是否穿过动力学</text><text x="28" y="67" font-size="21" fill="#233830" text-anchor="start" font-weight="600">PPO</text><rect x="28" y="92" width="165" height="76" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="110.5" y="130.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">Actor</text><text x="110.5" y="157.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">采样控制动作</text><rect x="275" y="92" width="165" height="76" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="357.5" y="130.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">环境 / 仿真器</text><text x="357.5" y="157.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">黑盒产生轨迹</text><rect x="522" y="92" width="165" height="76" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="604.5" y="130.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">奖励 + Critic</text><text x="604.5" y="157.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">构造优势信号</text><rect x="767" y="92" width="165" height="76" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="849.5" y="130.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">策略损失</text><text x="849.5" y="157.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">更新动作概率</text><path d="M 193 130 L 275 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 440 130 L 522 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 687 130 L 769 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 850 168 L 850 205 L 110 205 L 110 168" fill="none" stroke="#a95731" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#grad)"/><text x="480" y="233" font-size="17" fill="#a95731" text-anchor="middle" font-weight="400">优化策略损失，但不对环境状态转移求导</text><text x="28" y="275" font-size="21" fill="#233830" text-anchor="start" font-weight="600">SuperMimic</text><rect x="28" y="299" width="165" height="76" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="110.5" y="337.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">Actor</text><text x="110.5" y="364.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">产生控制动作</text><rect x="275" y="299" width="165" height="76" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="357.5" y="337.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">固定世界模型</text><text x="357.5" y="364.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">预测后续状态</text><rect x="522" y="299" width="165" height="76" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="604.5" y="337.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">奖励 + 末端价值</text><text x="604.5" y="364.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">形成预测回报</text><rect x="767" y="299" width="165" height="76" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="849.5" y="337.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">回报梯度</text><text x="849.5" y="364.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">沿时间链反传</text><path d="M 193 337 L 275 337" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 440 337 L 522 337" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 687 337 L 769 337" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 850 375 L 850 413 L 604 413 L 357 413 L 110 413 L 110 375" fill="none" stroke="#a95731" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#grad)"/><path d="M 357 413 L 357 375" fill="none" stroke="#a95731" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#grad)"/><path d="M 604 413 L 604 375" fill="none" stroke="#a95731" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#grad)"/><text x="480" y="453" font-size="17" fill="#a95731" text-anchor="middle" font-weight="400">保留世界模型与末端 Critic 对输入的导数，只更新 Actor 权重</text></g></svg>