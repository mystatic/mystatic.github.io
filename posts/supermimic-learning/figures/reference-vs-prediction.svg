<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">参考目标与预测状态同步推进</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#38654f" stroke-width="1.4"/></marker><marker id="grad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a95731" stroke-width="1.4"/></marker></defs><rect width="960" height="440" fill="#fffefb"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#233830"><text x="28" y="32" font-size="23" fill="#233830" text-anchor="start" font-weight="600">目标轨迹与预测轨迹，始终是两条线</text><text x="28" y="60" font-size="15" fill="#65756d" text-anchor="start" font-weight="400">示意：参考目标进入每一步 Actor，也进入每一步跟踪评价。</text><rect x="220" y="100" width="190" height="60" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="315.0" y="137.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">准备目标</text><rect x="220" y="260" width="190" height="70" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="315.0" y="295.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">预测身体状态</text><text x="315.0" y="322.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">可能存在执行偏差</text><path d="M 315 160 L 315 260" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="328" y="215" font-size="15" fill="#a95731" text-anchor="start" font-weight="400">比较 → 奖励</text><rect x="475" y="100" width="190" height="60" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="570.0" y="137.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">抬手目标</text><rect x="475" y="260" width="190" height="70" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="570.0" y="295.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">预测身体状态</text><text x="570.0" y="322.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">可能存在执行偏差</text><path d="M 570 160 L 570 260" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="583" y="215" font-size="15" fill="#a95731" text-anchor="start" font-weight="400">比较 → 奖励</text><rect x="730" y="100" width="190" height="60" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="825.0" y="137.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">挥拍目标</text><rect x="730" y="260" width="190" height="70" rx="12" fill="#edf1f3" stroke="#d8ded5"/><text x="825.0" y="295.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">预测身体状态</text><text x="825.0" y="322.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">可能存在执行偏差</text><path d="M 825 160 L 825 260" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="838" y="215" font-size="15" fill="#a95731" text-anchor="start" font-weight="400">比较 → 奖励</text><text x="28" y="137" font-size="19" fill="#233830" text-anchor="start" font-weight="550">参考运动</text><text x="28" y="300" font-size="19" fill="#233830" text-anchor="start" font-weight="550">预测运动</text><path d="M 410 130 L 475 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 410 295 L 475 295" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 665 130 L 730 130" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 665 295 L 730 295" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="370" font-size="17" fill="#233830" text-anchor="middle" font-weight="400">Actor 读目标与观测 → 控制指令 → 世界模型预测 → 再次决策</text><text x="480" y="409" font-size="18" fill="#233830" text-anchor="middle" font-weight="550">目标不是控制指令；预测轨迹也不是直接复制参考轨迹。</text></g></svg>