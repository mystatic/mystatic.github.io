<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title"><title id="title">部署时的闭环反馈控制</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#38654f" stroke-width="1.4"/></marker><marker id="grad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a95731" stroke-width="1.4"/></marker></defs><rect width="960" height="300" fill="#fffefb"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#233830"><text x="28" y="32" font-size="23" fill="#233830" text-anchor="start" font-weight="600">训练工具退到幕后，Actor 持续闭环控制</text><rect x="28" y="80" width="175" height="90" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="115.5" y="125.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">观测 + 参考目标</text><text x="115.5" y="152.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">历史身体反馈与目标</text><rect x="270" y="80" width="175" height="90" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="357.5" y="125.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">Actor</text><text x="357.5" y="152.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">输出控制动作</text><rect x="510" y="80" width="175" height="90" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="597.5" y="125.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">底层控制器</text><text x="597.5" y="152.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">执行关节设定值</text><rect x="750" y="80" width="182" height="90" rx="12" fill="#e7eee4" stroke="#d8ded5"/><text x="841.0" y="125.0" font-size="20" fill="#233830" text-anchor="middle" font-weight="550">真实身体</text><text x="841.0" y="152.0" font-size="15" fill="#65756d" text-anchor="middle" font-weight="400">产生实际运动</text><path d="M 203 125 L 270 125" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 445 125 L 510 125" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 685 125 L 750 125" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><path d="M 841 170 L 841 225 L 115 225 L 115 170" fill="none" stroke="#38654f" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="215" font-size="17" fill="#38654f" text-anchor="middle" font-weight="400">新的测量反馈 → 更新观测历史 → 下一次决策</text><text x="480" y="278" font-size="17" fill="#233830" text-anchor="middle" font-weight="400">标准部署路径无需每步运行世界模型或 Critic；实际完成仍由身体反馈确认。</text></g></svg>