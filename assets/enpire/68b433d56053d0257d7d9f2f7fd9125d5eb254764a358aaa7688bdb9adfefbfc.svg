<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="775" viewBox="0 0 1280 775" role="img" aria-label="同一台机器人，三种不同的“改进”"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#5b806f"/></marker></defs><rect width="100%" height="100%" fill="#f8faf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#233c31"><text x="38" y="48" font-size="27" font-weight="700">同一台机器人，三种不同的“改进”</text><text x="38" y="79" font-size="16" fill="#5c7065">教学重建｜研究外循环、参数学习和物理执行的职责不能互换</text><text x="38" y="135" font-size="19" font-weight="700" fill="#245f48">01  研究外循环</text><text x="350" y="135" font-size="16" fill="#5c7065">异步：按一次假设与评估推进</text><rect x="38" y="153" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="56" y="185" font-size="20" font-weight="650">编码 Agent</text><text x="56" y="213" font-size="16">读任务、轨迹、日志和视频</text><text x="56" y="238" font-size="16">提出可证伪的改进假设</text><rect x="453" y="153" width="375" height="122" rx="12" fill="#eef5ed" stroke="#b4c8b9"/><text x="471" y="185" font-size="20" font-weight="650">修改与试验</text><text x="471" y="213" font-size="16">改程序、算法、训练配置</text><text x="471" y="238" font-size="16">调用固定环境进行评估</text><rect x="868" y="153" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="886" y="185" font-size="20" font-weight="650">保留研究成果</text><text x="886" y="213" font-size="16">保留代码、配置、结果</text><text x="886" y="238" font-size="16">写下经验；继续下一轮</text><path d="M413 214 L453 214" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M828 214 L868 214" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="38" y="345" font-size="19" font-weight="700" fill="#245f48">02  参数学习循环</text><text x="350" y="345" font-size="16" fill="#5c7065">异步：仅在所选路线需要训练时</text><rect x="38" y="363" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="56" y="395" font-size="20" font-weight="650">轨迹与来源标签</text><text x="56" y="423" font-size="16">机器人数据、已有示范</text><text x="56" y="448" font-size="16">动作来源与奖励分开记录</text><rect x="453" y="363" width="375" height="122" rx="12" fill="#eef5ed" stroke="#b4c8b9"/><text x="471" y="395" font-size="20" font-weight="650">学习器 learner</text><text x="471" y="423" font-size="16">BC 更新策略；RL 更新</text><text x="471" y="448" font-size="16">actor、critic 等网络</text><rect x="868" y="363" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="886" y="395" font-size="20" font-weight="650">发布新权重</text><text x="886" y="423" font-size="16">推理进程接收策略参数</text><text x="886" y="448" font-size="16">编码 Agent 的权重未因此更新</text><path d="M413 424 L453 424" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M828 424 L868 424" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="38" y="555" font-size="19" font-weight="700" fill="#245f48">03  物理执行循环</text><text x="350" y="555" font-size="16" fill="#5c7065">论文报告：策略 30 Hz，关节控制 100 Hz</text><rect x="38" y="573" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="56" y="605" font-size="20" font-weight="650">当前观测</text><text x="56" y="633" font-size="16">图像与本体状态</text><text x="56" y="658" font-size="16">策略／程序产生动作目标</text><rect x="453" y="573" width="375" height="122" rx="12" fill="#eef5ed" stroke="#b4c8b9"/><text x="471" y="605" font-size="20" font-weight="650">控制与机器人</text><text x="471" y="633" font-size="16">目标转为控制指令</text><text x="471" y="658" font-size="16">接触、移动、插入或失败</text><rect x="868" y="573" width="375" height="122" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="886" y="605" font-size="20" font-weight="650">核验与下一步</text><text x="886" y="633" font-size="16">读取新观测；检查成功</text><text x="886" y="658" font-size="16">继续、恢复或终止并复位</text><path d="M413 634 L453 634" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M828 634 L868 634" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="38" y="757" font-size="15" fill="#5c7065">执行反馈进入数据与研究；权重发布改变后续动作。失败后重试本身不等于参数更新。</text></g></svg>