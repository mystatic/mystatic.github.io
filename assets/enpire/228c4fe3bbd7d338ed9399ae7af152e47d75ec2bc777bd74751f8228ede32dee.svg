<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-label="一次模型输出怎样变成可核验的插入"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#5b806f"/></marker></defs><rect width="100%" height="100%" fill="#f8faf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#233c31"><text x="38" y="48" font-size="27" font-weight="700">一次模型输出怎样变成可核验的插入</text><text x="38" y="79" font-size="16" fill="#5c7065">教学重建｜论文报告控制频率；三维增量与动作封装来自公开代码快照</text><rect x="35" y="120" width="270" height="145" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="53" y="152" font-size="20" font-weight="650">观测与策略</text><text x="53" y="180" font-size="16">筛选图像和本体状态</text><text x="53" y="205" font-size="16">视觉编码 → 策略网络</text><text x="53" y="230" font-size="16">输出归一化三维增量</text><rect x="350" y="120" width="280" height="145" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="368" y="152" font-size="20" font-weight="650">动作接口</text><text x="368" y="180" font-size="16">裁剪并换算为物理距离</text><text x="368" y="205" font-size="16">补固定旋转与夹爪状态</text><text x="368" y="230" font-size="16">封装为机器人侧动作</text><rect x="675" y="120" width="255" height="145" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="693" y="152" font-size="20" font-weight="650">控制接口</text><text x="693" y="180" font-size="16">末端目标 → 关节目标</text><text x="693" y="205" font-size="16">关节 PD + 重力补偿</text><text x="693" y="230" font-size="16">论文：100 Hz 关节控制</text><rect x="975" y="120" width="270" height="145" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="993" y="152" font-size="20" font-weight="650">物理结果</text><text x="993" y="180" font-size="16">对准、接触、滑动或卡住</text><text x="993" y="205" font-size="16">实际位置可能偏离目标</text><text x="993" y="230" font-size="16">相机与本体状态再次采样</text><path d="M305 190 L350 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M630 190 L675 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M930 190 L975 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="785" y="365" width="460" height="145" rx="12" fill="#eef5ed" stroke="#b4c8b9"/><text x="803" y="397" font-size="20" font-weight="650">固定判定器与执行状态机</text><text x="803" y="425" font-size="16">组合视觉对齐、插入深度与接触信息</text><text x="803" y="450" font-size="16">未成功：继续／恢复；终止：记录并复位</text><text x="803" y="475" font-size="16">具体阈值与部分控制衔接仍需原实验配置</text><path d="M1110 265 L1110 365" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 435 L170 435 L170 265" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="421" font-size="19">下一次观测与动作</text><text x="38" y="561" font-size="17" fill="#245f48">控制 API 返回、动作目标下发、任务判定成功，是三个不同的事件。</text><text x="38" y="590" font-size="16" fill="#5c7065">论文报告策略 30 Hz；代码中的动作打包长度不能直接换算成实际模型调用频率。</text></g></svg>