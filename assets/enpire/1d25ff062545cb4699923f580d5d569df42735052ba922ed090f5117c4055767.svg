<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="一条插销轨迹怎样进入训练"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#5b806f"/></marker></defs><rect width="100%" height="100%" fill="#f8faf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#233c31"><text x="38" y="48" font-size="27" font-weight="700">一条插销轨迹怎样进入训练</text><text x="38" y="79" font-size="16" fill="#5c7065">教学重建｜论文附录 B.5 + 公开实现；示范数量、具体实验采样配置需分别核对</text><rect x="35" y="115" width="280" height="150" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="53" y="147" font-size="20" font-weight="650">① 完成并写入轨迹</text><text x="53" y="175" font-size="16">图像、状态、动作</text><text x="53" y="200" font-size="16">奖励、终止、时间对齐</text><text x="53" y="225" font-size="16">逐步记录 rl / human 来源</text><rect x="370" y="115" width="290" height="150" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="388" y="147" font-size="20" font-weight="650">② 后台读取与预处理</text><text x="388" y="175" font-size="16">等轨迹文件完整后读取</text><text x="388" y="200" font-size="16">图像与本体状态筛选</text><text x="388" y="225" font-size="16">物理动作转回策略尺度</text><rect x="715" y="115" width="240" height="150" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="733" y="147" font-size="20" font-weight="650">③ 两类缓冲区</text><text x="733" y="175" font-size="16">自主动作 → 在线数据</text><text x="733" y="200" font-size="16">人工动作 → 示范数据</text><text x="733" y="225" font-size="16">分类规则依配置而定</text><rect x="1010" y="115" width="235" height="150" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="1028" y="147" font-size="20" font-weight="650">④ 取训练批次</text><text x="1028" y="175" font-size="16">有示范时可混合采样</text><text x="1028" y="200" font-size="16">同一轨迹可多次使用</text><text x="1028" y="225" font-size="16">不是每动一次只学一次</text><path d="M315 190 L370 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 190 L715 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M955 190 L1010 190" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="350" width="385" height="155" rx="12" fill="#eef5ed" stroke="#b4c8b9"/><text x="388" y="382" font-size="20" font-weight="650">⑤ 选择更新路线</text><text x="388" y="410" font-size="16">BC：提高记录动作的似然</text><text x="388" y="435" font-size="16">RL：拟合 Q，再优化策略</text><text x="388" y="460" font-size="16">BC 正则：须核对实际实验实现</text><rect x="855" y="350" width="390" height="155" rx="12" fill="#fff" stroke="#b4c8b9"/><text x="873" y="382" font-size="20" font-weight="650">⑥ 产生可验证的候选策略</text><text x="873" y="410" font-size="16">保存／发布策略参数</text><text x="873" y="435" font-size="16">重新在固定环境中运行</text><text x="873" y="460" font-size="16">实际成功率反馈给编码 Agent</text><path d="M1127 265 L1127 313" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1127 313 L563 313 L563 350" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M755 425 L855 425" fill="none" stroke="#5b806f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="38" y="555" font-size="18" fill="#245f48">训练专用：回放数据、奖励目标、critic、优化器。执行策略通常只需要当前观测与策略参数。</text><text x="38" y="585" font-size="16" fill="#5c7065">程序策略路线绕开梯度训练：Agent 修改程序 → 固定环境评估 → 保留或放弃修改。</text></g></svg>